<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort vergessen – Reinigungsfirma Team Hamburg</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b0f19 0%, #141f33 40%, #1e2d4a 70%, #2a3f66 100%);
      padding: 40px 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(74,144,217,0.08) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px; left: -100px;
      animation: float-slow 10s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 44px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
      display: block;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }
    .auth-logo:hover {
      opacity: 0.9;
    }
    .auth-logo-icon {
      width: 48px; height: 48px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%; border-top-color: transparent;
      margin: 0 auto 12px; position: relative;
      animation: spin-slow 8s linear infinite;
    }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .auth-logo-icon::after {
      content: ''; position: absolute; inset: 4px;
      border: 2px dotted rgba(255,255,255,0.3); border-radius: 50%;
    }
    .auth-logo .logo-name { font-size: 1rem; }
    .auth-logo .logo-city { font-size: 0.82rem; }

    .auth-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      transition: all 0.3s;
    }

    .form-group input::placeholder { color: rgba(255,255,255,0.28); }

    .form-group input:focus {
      outline: none;
      border-color: #4a90d9;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(74,144,217,0.18);
    }

    .auth-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4a90d9, #5ba0e8);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(74,144,217,0.3);
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(74,144,217,0.45);
    }

    .auth-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-links {
      margin-top: 22px;
      text-align: center;
    }

    .auth-link-row {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
    }

    .auth-link-row a {
      color: #4a90d9;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-link-row a:hover { color: #6bb5ff; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .divider span {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
    }

    .quick-contact {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-btn {
      flex: 1;
      padding: 11px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: rgba(255,255,255,0.6);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .quick-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    .auth-message {
      padding: 13px 16px;
      border-radius: 9px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .auth-message.error {
      display: block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    .auth-message.success {
      display: block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <div class="auth-logo-icon"></div>
        <div class="logo-text">
          <span class="logo-name">Reinigungsfirma</span>
          <span class="logo-city">Team Hamburg</span>
        </div>
      </a>

      <h1 class="auth-title">Passwort vergessen?</h1>
      <p class="auth-subtitle">Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen deines Passworts.</p>

      <div class="auth-message" id="auth-message"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email">E-Mail-Adresse</label>
          <input type="email" id="forgot-email" required placeholder="ihre@email.de" autocomplete="email">
        </div>
        <button type="submit" class="auth-btn" id="submit-btn">Link senden</button>
      </form>

      <div class="auth-links">
        <div class="auth-link-row">
          <a href="login.html">← Zurück zum Login</a>
        </div>
      </div>

      <div class="divider"><span>oder direkt kontaktieren</span></div>

      <div class="quick-contact">
        <a href="tel:+4915774864072" class="quick-btn">📞 Anrufen</a>
        <a href="https://wa.me/4915774864072" class="quick-btn" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a href="index.html#kontakt" class="quick-btn">✉️ Formular</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgot-form');
    const msgBox = document.getElementById('auth-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();

      if (!email) return;

      submitBtn.textContent = '⏳ Wird gesendet...';
      submitBtn.disabled = true;
      msgBox.style.display = 'none';

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        msgBox.className = data.success ? 'auth-message success' : 'auth-message error';
        msgBox.textContent = data.success ? '✅ ' + data.message : '❌ ' + data.message;
        msgBox.style.display = 'block';

        if (data.success) {
          form.reset();
        }
      } catch (err) {
        msgBox.className = 'auth-message error';
        msgBox.textContent = '❌ Server nicht erreichbar. Bitte versuchen Sie es später erneut.';
        msgBox.style.display = 'block';
      } finally {
        submitBtn.textContent = 'Link senden';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
