<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – Reinigungsfirma Team Hamburg</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b0f19 0%, #141f33 40%, #1e2d4a 70%, #2a3f66 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(74,144,217,0.08) 0%, transparent 70%);
      border-radius: 50%;
      top: -150px;
      left: -150px;
      animation: float-slow 12s ease-in-out infinite;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(107,181,255,0.05) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -100px;
      right: -100px;
      animation: float-slow 16s ease-in-out infinite reverse;
      pointer-events: none;
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-25px) scale(1.05); }
    }

    .error-container {
      text-align: center;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      background: linear-gradient(135deg, rgba(74,144,217,0.25), rgba(107,181,255,0.15));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -4px;
      user-select: none;
    }

    .error-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .error-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .error-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      text-decoration: none;
    }

    .error-btn-primary {
      background: linear-gradient(135deg, #4a90d9, #5ba0e8);
      color: #fff;
      box-shadow: 0 4px 18px rgba(74,144,217,0.35);
    }

    .error-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(74,144,217,0.5);
    }

    .error-btn-secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(255,255,255,0.15);
    }

    .error-btn-secondary:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
      transform: translateY(-2px);
    }

    .error-footer {
      margin-top: 48px;
    }

    .error-footer a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.3);
      transition: color 0.3s;
    }

    .error-footer a:hover {
      color: #4a90d9;
    }

    .error-logo {
      margin-bottom: 32px;
    }

    .error-logo .logo-name {
      font-size: 0.82rem;
    }

    .error-logo .logo-city {
      font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="error-logo">
      <div class="logo-text" style="display:flex;flex-direction:column;align-items:center;line-height:1.1">
        <span class="logo-name">Reinigungsfirma</span>
        <span class="logo-city">Team Hamburg</span>
      </div>
    </div>

    <div class="error-code">404</div>
    <span class="error-icon">🧹</span>
    <h1 class="error-title">Diese Seite wurde gründlich gereinigt</h1>
    <p class="error-desc">
      Leider konnten wir die gewünschte Seite nicht finden. Möglicherweise wurde sie
      verschoben oder existiert nicht mehr. Kein Problem – wir helfen Ihnen weiter!
    </p>

    <div class="error-buttons">
      <a href="/" class="error-btn error-btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Zur Startseite
      </a>
      <a href="/#kontakt" class="error-btn error-btn-secondary">Kontakt aufnehmen</a>
    </div>

    <div class="error-footer">
      <a href="tel:+4915774864072">📞 +49 1577 48 64 072</a>
    </div>
  </div>

</body>
</html>
