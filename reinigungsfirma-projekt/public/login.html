<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Reinigungsfirma Team Hamburg</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b0f19 0%, #141f33 40%, #1e2d4a 70%, #2a3f66 100%);
      padding: 40px 20px;
      position: relative;
    }

    /* Animierter Hintergrund */
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(74,144,217,0.08) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px; left: -100px;
      animation: float-slow 10s ease-in-out infinite;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(107,181,255,0.06) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -80px; right: -80px;
      animation: float-slow 14s ease-in-out infinite reverse;
      pointer-events: none;
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .auth-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 44px 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
      display: block;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }
    .auth-logo:hover {
      opacity: 0.9;
    }

    .auth-logo-icon {
      width: 52px; height: 52px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      border-top-color: transparent;
      margin: 0 auto 12px;
      position: relative;
      animation: spin-slow 8s linear infinite;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .auth-logo-icon::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 2px dotted rgba(255,255,255,0.3);
      border-radius: 50%;
    }

    .auth-logo .logo-name { font-size: 1rem; }
    .auth-logo .logo-city { font-size: 0.82rem; }

    .auth-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      transition: all 0.3s;
    }

    .form-group input::placeholder { color: rgba(255,255,255,0.28); }

    .form-group input:focus {
      outline: none;
      border-color: #4a90d9;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(74,144,217,0.18);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      padding-right: 48px;
    }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color 0.3s;
      line-height: 1;
    }
    .toggle-pw:hover { color: rgba(255,255,255,0.75); }

    .auth-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4a90d9, #5ba0e8);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(74,144,217,0.3);
      position: relative;
      overflow: hidden;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(74,144,217,0.45);
    }

    .auth-btn:active {
      transform: translateY(0);
    }

    .auth-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-links {
      margin-top: 22px;
    }

    .auth-link-row {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }

    .auth-link-row a {
      color: #4a90d9;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-link-row a:hover { color: #6bb5ff; }

    .auth-back {
      text-align: center;
      margin-top: 16px;
    }

    .auth-back a {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.3);
      transition: color 0.2s;
    }

    .auth-back a:hover { color: rgba(255,255,255,0.6); }

    .auth-message {
      padding: 13px 16px;
      border-radius: 9px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      line-height: 1.5;
    }

    .auth-message.error {
      display: block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }

    .auth-message.success {
      display: block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.25);
      color: #86efac;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .divider span {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
    }

    .quick-contact {
      display: flex;
      gap: 10px;
    }

    .quick-btn {
      flex: 1;
      padding: 11px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: rgba(255,255,255,0.6);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .quick-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <div class="auth-logo-icon"></div>
        <div class="logo-text">
          <span class="logo-name">Reinigungsfirma</span>
          <span class="logo-city">Team Hamburg</span>
        </div>
      </a>

      <h1 class="auth-title">Willkommen zurück</h1>
      <p class="auth-subtitle">Melden Sie sich in Ihrem Konto an</p>

      <div class="auth-message" id="auth-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-Mail-Adresse</label>
          <input type="email" id="login-email" required placeholder="ihre@email.de" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Passwort</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" required placeholder="Ihr Passwort" autocomplete="current-password">
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Passwort anzeigen/verbergen">👁</button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="login-btn">Anmelden</button>
      </form>

      <div class="auth-links">
        <div class="auth-link-row">
          <a href="forgot-password.html">Passwort vergessen?</a>
        </div>
        <div class="auth-link-row">
          Noch kein Konto? <a href="register.html">Jetzt registrieren</a>
        </div>
      </div>

      <div class="divider"><span>oder direkt kontaktieren</span></div>

      <div class="quick-contact">
        <a href="tel:+4915774864072" class="quick-btn">📞 Anrufen</a>
        <a href="https://wa.me/4915774864072" class="quick-btn" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a href="index.html#kontakt" class="quick-btn">✉️ Formular</a>
      </div>

      <div class="auth-back">
        <a href="index.html">← Zurück zur Startseite</a>
      </div>
    </div>
  </div>

  <script>
    // Passwort anzeigen/verbergen
    const togglePw = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('login-password');
    let pwVisible = false;

    togglePw.addEventListener('click', () => {
      pwVisible = !pwVisible;
      pwInput.type = pwVisible ? 'text' : 'password';
      togglePw.textContent = pwVisible ? '🙈' : '👁';
      togglePw.setAttribute('aria-label', pwVisible ? 'Passwort verbergen' : 'Passwort anzeigen');
    });

    // Login-Formular
    const loginForm = document.getElementById('login-form');
    const messageBox = document.getElementById('auth-message');
    const loginBtn = document.getElementById('login-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showMsg('Bitte E-Mail und Passwort eingeben.', 'error');
        return;
      }

      loginBtn.textContent = '⏳ Wird angemeldet...';
      loginBtn.disabled = true;
      messageBox.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.success) {
          showMsg('✅ Login erfolgreich! Weiterleitung...', 'success');
          localStorage.setItem('token', data.token);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('user', JSON.stringify(data.user));

          const role = data.user.role || 'kunde';
          let redirectUrl = 'dashboard.html';
          if (role === 'admin') redirectUrl = 'admin.html';
          else if (role === 'mitarbeiter') redirectUrl = 'mitarbeiter.html';

          setTimeout(() => window.location.href = redirectUrl, 1200);
        } else {
          showMsg('❌ ' + data.message, 'error');
          loginBtn.textContent = 'Anmelden';
          loginBtn.disabled = false;
        }
      } catch (err) {
        showMsg('❌ Server nicht erreichbar. Bitte versuchen Sie es später.', 'error');
        loginBtn.textContent = 'Anmelden';
        loginBtn.disabled = false;
      }
    });

    function showMsg(msg, type) {
      messageBox.className = 'auth-message ' + type;
      messageBox.textContent = msg;
      messageBox.style.display = '';
    }

    // Wenn bereits eingeloggt → weiterleiten
    const existingToken = localStorage.getItem('token');
    const existingUser = JSON.parse(localStorage.getItem('user') || '{}');
    if (existingToken && existingUser.role) {
      const role = existingUser.role;
      if (role === 'admin') window.location.href = 'admin.html';
      else if (role === 'mitarbeiter') window.location.href = 'mitarbeiter.html';
      else window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
