<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#2a3f66"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#6bb5ff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- T + H initials stylized -->
  <text x="16" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800" font-size="16" fill="url(#accent)">TH</text>
  <!-- Sparkle -->
  <circle cx="25" cy="7" r="2" fill="#6bb5ff" opacity="0.8"/>
  <circle cx="27" cy="5" r="1" fill="#fff" opacity="0.6"/>
</svg>
